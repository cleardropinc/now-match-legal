<!-- 転送板。条文の正本は cleardrop.jp にある（同じ条文を2箇所に置かない）。
     GitHub Pages は 301 を返せないので、canonical ＋ meta refresh ＋ JS の
     3つで送る。配信済みのアプリが lib/legal_links.dart でこのURLを焼き込んで
     いるため、このファイルは消さないこと。

     ここはハッシュを引き継ぐ。1枚に #privacy #terms #tokushoho #support が
     並ぶ作りで、ハッシュが節の識別子そのものだったため（ファイルごとに
     分かれていた resuru-legal とは事情が違う）。

     本文にも転送先への実リンクを置いてある。JS も meta refresh も辿らずに
     取得するクローラ（App Review を含む）に、条文の在り処が見えるようにする
     ためなので、消さないこと。 -->
<link rel="canonical" href="https://cleardrop.jp/suguiko/legal">
<meta http-equiv="refresh" content="0; url=https://cleardrop.jp/suguiko/legal">
<script>
(function () {
  var map = {
    '#privacy':   'https://cleardrop.jp/suguiko/legal#privacy',
    '#terms':     'https://cleardrop.jp/suguiko/legal#terms',
    '#tokushoho': 'https://cleardrop.jp/suguiko/legal#tokushoho',
    '#support':   'https://cleardrop.jp/suguiko/support',
    '#top':       'https://cleardrop.jp/suguiko'
  }
  location.replace(map[location.hash] || 'https://cleardrop.jp/suguiko/legal')
})()
</script>
